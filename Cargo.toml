[workspace]
members = [
    "crates/sentinel-core",
    "crates/sentinel-ingest",
    "crates/sentinel-normalizer",
    "crates/sentinel-detection",
    "crates/sentinel-correlation",
    "crates/sentinel-risk",
    "crates/sentinel-mitre",
    "crates/sentinel-response",
    "crates/sentinel-storage",
    "crates/sentinel-api",
    "services/sentinel-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SentinelRS Core Security Team"]
license = "Apache-2.0"

[workspace.dependencies]
# Async & Networking
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros", "json"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
reqwest = { version = "0.12", features = ["json"] }

# Serialization & Models
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Data Structures & Graph
petgraph = { version = "0.6", features = ["serde-1"] }
dashmap = { version = "5.5", features = ["serde"] }
parking_lot = "0.12"
rayon = "1.10"

# Error Handling & Logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Internal workspace crates
sentinel-core = { path = "crates/sentinel-core" }
sentinel-ingest = { path = "crates/sentinel-ingest" }
sentinel-normalizer = { path = "crates/sentinel-normalizer" }
sentinel-detection = { path = "crates/sentinel-detection" }
sentinel-correlation = { path = "crates/sentinel-correlation" }
sentinel-risk = { path = "crates/sentinel-risk" }
sentinel-mitre = { path = "crates/sentinel-mitre" }
sentinel-response = { path = "crates/sentinel-response" }
sentinel-storage = { path = "crates/sentinel-storage" }
sentinel-api = { path = "crates/sentinel-api" }
